<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MAUI Feature Showcase</title>
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <!-- Navigation Header -->
            <div class="nav-header">
                <button v-if="$route.path !== '/'" class="back-btn" @click="$router.back()">‹</button>
                <h1>{{ pageTitle }}</h1>
            </div>

            <!-- Route View -->
            <router-view v-slot="{ Component }">
                <transition name="fade" mode="out-in">
                    <component :is="Component" />
                </transition>
            </router-view>
        </div>
    </div>

    <!-- Vue API setup (must load first) -->
    <script src="js/vue-setup.js"></script>

    <!-- Components -->
    <script src="js/components/HomePage.js"></script>
    <script src="js/components/ControlsPage.js"></script>
    <script src="js/components/LayoutsPage.js"></script>
    <script src="js/components/DataPage.js"></script>
    <script src="js/components/GraphicsPage.js"></script>
    <script src="js/components/PlatformPage.js"></script>

    <!-- Router & App bootstrap -->
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
